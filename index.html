<!doctype html>
<meta charset="utf-8">
<title>Acme architecture</title>
<script>
  // The viewer lives in its own repo; this repo only holds the data.
  // Extra query params are passed through (e.g. ?view=Pulled%20apart or ?present).
  const VIEWER = 'https://aaronp.github.io/celldeck/';
  const src = new URL('deck.json', location.href).href;
  location.replace(VIEWER + '?src=' + encodeURIComponent(src) + location.search.replace(/^\?/, '&') + location.hash);
</script>
<a href="deck.json">deck.json</a>
